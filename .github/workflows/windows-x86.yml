name: Windows x86 Rust checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # OPC UA network probing is environment/timing-sensitive in hosted CI.
      # Keep it visible as a separate, non-blocking diagnostic rather than
      # allowing it to obscure deterministic UI/model regression failures.
      - name: Build and run library tests
        run: cargo test --lib --target i686-pc-windows-msvc -- --skip loopback_tcp_without_opc_ua_is_not_a_scan_result
      - name: OPC UA loopback probe (diagnostic)
        continue-on-error: true
        run: cargo test --lib --target i686-pc-windows-msvc loopback_tcp_without_opc_ua_is_not_a_scan_result -- --exact --nocapture
      - name: Run UI interactions
        run: cargo test --test ui_interactions --target i686-pc-windows-msvc
