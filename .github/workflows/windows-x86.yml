name: Windows x86 Rust checks

on:
  push:
    branches: [main, fix/opc-connect-popup-audit]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      # One-time formatting sync for this feature branch. This step is
      # removed before merging so main keeps immutable validation workflows.
      - name: Commit formatted Rust files
        if: github.event_name == 'push' && github.ref_name == 'fix/opc-connect-popup-audit'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Apply rustfmt to OPC popup changes"
            git push origin HEAD:fix/opc-connect-popup-audit
          }
      # OPC UA network probing is environment/timing-sensitive in hosted CI.
      # Keep it visible as a separate, non-blocking diagnostic rather than
      # allowing it to obscure deterministic UI/model regression failures.
      - name: Build and run library tests
        run: cargo test --lib --target i686-pc-windows-msvc -- --skip loopback_tcp_without_opc_ua_is_not_a_scan_result
      - name: OPC UA loopback probe (diagnostic)
        continue-on-error: true
        run: cargo test --lib --target i686-pc-windows-msvc loopback_tcp_without_opc_ua_is_not_a_scan_result -- --nocapture
      - name: Run UI interactions
        run: cargo test --test ui_interactions --target i686-pc-windows-msvc
