name: Windows x86 Rust checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: i686-pc-windows-msvc
          components: rustfmt
      - name: Format
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            cargo fmt --all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "import base64,json,pathlib,subprocess; names=subprocess.check_output(['git','diff','--name-only','--','*.rs'],text=True).splitlines(); [(lambda data,p: [(print('RUSTFMT_REPLACE '+json.dumps({'path':p,'sha':subprocess.check_output(['git','hash-object','--stdin'],input=data).decode().strip(),'part':i//9000,'total':(len(data)+8999)//9000,'data':base64.b64encode(data[i:i+9000]).decode()}))) for i in range(0,len(data),9000)])(pathlib.Path(p).read_bytes().replace(b'\r\n',b'\n'),p) for p in names]"
            exit 1
          }
      - name: Build both app binaries and check layer boundaries
        shell: bash
        run: |
          cargo build --target i686-pc-windows-msvc -p opclook -p opclook-cli
          cargo build --target i686-pc-windows-msvc -p opclook-cli
          python scripts/check-cli-boundary.py i686-pc-windows-msvc
      - name: Isolate Windows COM and VARIANT tests
        shell: bash
        run: bash scripts/ci-isolate-windows-com.sh
      - name: Shared crate and CLI tests
        if: ${{ success() || failure() }}
        shell: bash
        run: scripts/ci-test.sh "Shared crate or CLI tests failed" -p opclook-engine -p opclook-backend -p opclook-contract -p opclook-locale -p opclook-cli --target i686-pc-windows-msvc -- --skip loopback_tcp_without_opc_ua_is_not_a_scan_result
      # OPC UA network probing is environment/timing-sensitive in hosted CI.
      # Keep it visible as a separate, non-blocking diagnostic rather than
      # allowing it to obscure deterministic UI/model regression failures.
      - name: Build and run library tests
        shell: bash
        run: scripts/ci-test.sh "Library tests failed" -p opclook --lib --target i686-pc-windows-msvc -- --skip loopback_tcp_without_opc_ua_is_not_a_scan_result
      - name: Net helper unit tests (no privileged operations)
        env:
          OPCLOOK_HELPER_TEST_NO_MANIFEST: "1"
        run: cargo test -p opclook-nethelper --target i686-pc-windows-msvc
      - name: Build elevated net helper
        run: cargo build -p opclook-nethelper --target i686-pc-windows-msvc
      - name: OPC UA loopback probe (diagnostic)
        continue-on-error: true
        run: cargo test -p opclook-backend --lib --target i686-pc-windows-msvc loopback_tcp_without_opc_ua_is_not_a_scan_result -- --nocapture
      # All integration tests (ui_interactions, no_hardcoded_ui_strings, i18n and
      # the rest). Network-dependent ones are `#[ignore]` and stay skipped.
      # On failure, compiler errors, failing tests and their panic output are
      # emitted as one error annotation (scripts/ci-test.sh), readable from the
      # checks API without downloading the full job log.
      - name: Run integration tests
        shell: bash
        run: scripts/ci-test.sh "Integration tests failed" -p opclook --tests --target i686-pc-windows-msvc

  # Same gate as the developer script: fmt, check --all-targets, lib and
  # integration tests on Linux (Windows-only tests are ignored there).
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: System libraries for egui/eframe
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev
          libegl1-mesa-dev pkg-config fonts-noto-cjk
      - name: scripts/check-linux.sh
        run: |
          set -o pipefail
          if ! scripts/check-linux.sh 2>&1 | tee gate-output.txt; then
            scripts/ci-annotate.sh "Linux gate failed" gate-output.txt
            exit 1
          fi
