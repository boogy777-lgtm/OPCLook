name: Windows x86 Rust checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # OPC UA network probing is environment/timing-sensitive in hosted CI.
      # Keep it visible as a separate, non-blocking diagnostic rather than
      # allowing it to obscure deterministic UI/model regression failures.
      - name: Build and run library tests
        run: cargo test --lib --target i686-pc-windows-msvc -- --skip loopback_tcp_without_opc_ua_is_not_a_scan_result
      - name: OPC UA loopback probe (diagnostic)
        continue-on-error: true
        run: cargo test --lib --target i686-pc-windows-msvc loopback_tcp_without_opc_ua_is_not_a_scan_result -- --nocapture
      # All integration tests (ui_interactions, no_hardcoded_ui_strings, i18n and
      # the rest). Network-dependent ones are `#[ignore]` and stay skipped.
      # On failure, the failing tests and their panic output are also emitted as
      # one error annotation, so they can be read from the checks API without
      # downloading the full job log.
      - name: Run integration tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --tests --target i686-pc-windows-msvc 2>&1 | tee test-output.txt; then
            tr -d '\r' < test-output.txt > test-output-clean.txt
            msg=$( { grep -E "^test .* FAILED$" test-output-clean.txt; grep -E -A15 "^---- .* stdout ----$" test-output-clean.txt; } \
              | head -200 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Integration tests failed::${msg}"
            exit 1
          fi

  # Same gate as the developer script: fmt, check --all-targets, lib and
  # integration tests on Linux (Windows-only tests are ignored there).
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: System libraries for egui/eframe
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev
          libegl1-mesa-dev pkg-config fonts-noto-cjk
      - name: scripts/check-linux.sh
        run: scripts/check-linux.sh
