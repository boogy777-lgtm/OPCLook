[package]
name = "opcda-egui"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Native Rust/egui rewrite of EleSy OPC Test Client 2.1 (OPC DA 2.0)"
license = "MIT"
repository = "https://github.com/boogy777-lgtm/OPCLook"

[workspace]
members = ["nethelper"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "default_fonts"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
rfd = "0.15"
async-opcua = { version = "0.19", features = ["client"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Windows-only (COM / WinAPI). Not built on other hosts, where the DA/net
# modules compile to "unsupported on this platform" stubs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

# Non-Windows hosts (Linux dev/CI check stand): eframe needs a winit backend.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "default_fonts", "x11"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
egui_kittest = "0.37"
